spring:
  application:
    name: binitech-auth
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${AUTH_MONGODB_URI}
      database: ${AUTH_MONGODB_DATABASE:binitech_auth}
      auto-index-creation: true
auth:
  service-key: ${AUTH_SERVICE_KEY}
  application-id: ${AUTH_APPLICATION_ID:pdv}
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}
totp:
  algorithm: ${AUTH_TOTP_ALGORITHM:SHA512}
  digits: ${AUTH_TOTP_DIGITS:6}
  period: ${AUTH_TOTP_PERIOD:30}
  window: ${AUTH_TOTP_WINDOW:1}
  issuer: ${AUTH_TOTP_ISSUER:BiniTech}
security:
  pepper: ${SECURITY_PEPPER}
cors:
  allowed-origins: ${AUTH_CORS_ALLOWED_ORIGINS:http://localhost:4200}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
